<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>WhiteWolves.eu</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: white;
}

/* HERO */
.hero {
    height: 100vh;
    background: url("https://images.unsplash.com/photo-1542751371-adc38448a05e") center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.hero h1 {
    font-size: 60px;
    color: #00ffcc;
}

.hero p {
    font-size: 20px;
    margin: 10px 0;
}

.btn {
    padding: 15px 30px;
    background: #00ffcc;
    color: black;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

/* SECTIONS */
section {
    padding: 50px;
    text-align: center;
}

.box {
    background: #1a1a1a;
    padding: 20px;
    margin: 10px;
    border-radius: 10px;
    display: inline-block;
    width: 250px;
}

/* FOOTER */
footer {
    background: #111;
    padding: 20px;
}
</style>

</head>

<body>

<div class="hero">
    <h1>WhiteWolves</h1>
    <p>EU/CZ Rust server pro všechny hráče</p>
    <a class="btn" href="#">PŘIPOJIT SE</a>
</div>

<section>
    <h2>⚙️ Server Info</h2>

    <div class="box">Raid limit: 1x denně</div>
    <div class="box">2x stack</div>
    <div class="box">Bez cheatů</div>
    <div class="box">Aktivní admin</div>
</section>

<section>
    <h2>🎮 Proč hrát u nás</h2>

    <div class="box">Server pro nováčky</div>
    <div class="box">Férový gameplay</div>
    <div class="box">Komunita</div>
</section>

<section>
    <h2>👑 Admin tým</h2>

    <div class="box">Vrah z Kampali - Zakladatel</div>
</section>

<section>
    <h2>💬 Komunita</h2>

    <a class="btn" href="#">DISCORD</a>
</section>

<footer>
    © 2026 WhiteWolves.eu
</footer>

</body>
</html>
